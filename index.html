<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚠️⚠️⚠️ ALERTA CRÍTICA DEL SISTEMA ⚠️⚠️⚠️</title>

<style>
body {
    margin: 0;
    background: #0d0d0d;
    color: #00ff9c;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    width: 90%;
    max-width: 400px;
    background: #121212;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 0 30px #00ff9c33;
    text-align: center;
}

.header {
    color: #ff3b3b;
    font-size: 18px;
    margin-bottom: 10px;
    animation: blink 1s infinite;
}

@keyframes blink {
    0% {opacity: 1;}
    50% {opacity: 0.4;}
    100% {opacity: 1;}
}

img {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 15px;
}

.text {
    min-height: 60px;
    font-size: 14px;
}

button {
    display: none;
    margin-top: 20px;
    padding: 12px;
    width: 100%;
    background: #ff3b3b;
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">⚠️⚠️⚠️ ALERTA DEL SISTEMA ANDROID ⚠️⚠️⚠️</div>

    <img src="https://i.imgur.com/fmB640P.png" alt="mono hacker">

    <div class="text" id="text">Inicializando sistema...</div>

    <button id="btn" onclick="limpiar()">LIMPIAR</button>
</div>

<script>

const frases = [
"Has sido hackeado...",
"Hemos detectado 3GB de contenido sospechoso...",
"Conectando con servidor de Bangladesh...",
"Rezando tres aves marías...",
"Minando cryptos modo hardcore...",
"Eres un pringado... ya estás infectado 😈"
];

let i = 0;

function siguienteFrase() {
    if (i < frases.length) {
        document.getElementById("text").innerText = frases[i];
        i++;
        setTimeout(siguienteFrase, 2000);
    } else {
        document.getElementById("btn").style.display = "block";
    }
}

setTimeout(siguienteFrase, 1500);

function limpiar() {
    alert("Te hemos limpiado la cuenta corriente gracias guapetón 💸");
    setTimeout(()=>{
        alert("Has sido troleado por Vyk 😎");
    }, 500);
}

</script>

</body>
</html>
